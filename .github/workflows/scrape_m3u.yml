name: Scrape Indian IPTV Channels

on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:
    inputs:
      force_fresh:
        description: 'Force fresh data sync'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: scrape-iptv
  cancel-in-progress: true

env:
  PYTHON: '3.12'

jobs:
  # ═══════════════════════════════════════════════════════════════
  # SYNC: Download data files + channel lists (runs once)
  # ═══════════════════════════════════════════════════════════════
  sync-data:
    name: Sync Database
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Download iptv-org CSVs
        run: |
          mkdir -p data
          for file in channels.csv feeds.csv logos.csv languages.csv categories.csv blocklist.csv subdivisions.csv countries.csv; do
            curl -sSfL --retry 3 --retry-delay 5 \
              "https://raw.githubusercontent.com/iptv-org/database/master/data/$file" \
              -o "data/$file" && echo "  $file OK" || echo "  WARN: $file failed"
          done

      - name: Validate
        run: python scripts/validate_data.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          git diff --staged --quiet || {
            git commit -m "sync(iptv-org): $(date -u +'%Y-%m-%d')"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "Push failed (attempt $i), retrying..."
              sleep 10
            done
          }

  sync-channels:
    name: Sync Channel Lists
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON }}
          cache: pip

      - run: pip install requests beautifulsoup4 lxml

      - name: Refresh from BroadcastSeva
        run: python scripts/sync_channel_lists.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channel_lists/ || true
          git diff --staged --quiet || {
            git commit -m "sync(channel-lists): $(date -u +'%Y-%m-%d')"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "Push failed (attempt $i), retrying..."
              sleep 10
            done
          }

  # ═══════════════════════════════════════════════════════════════
  # SCRAPE: Fan-out — one job per language (parallel)
  # ═══════════════════════════════════════════════════════════════
  scrape-language:
    name: Scrape ${{ matrix.language }}
    needs: [sync-data, sync-channels]
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        language:
          - Hindi
          - Tamil
          - Telugu
          - Malayalam
          - Kannada
          - Bengali
          - Marathi
          - Punjabi
          - Gujarati
          - Odia
          - Urdu
          - Bhojpuri
          - Assamese
          - English
        timeout:
          - 95
        include:
          - language: Malayalam
            timeout: 75
          - language: Kannada
            timeout: 75
          - language: Marathi
            timeout: 75
          - language: Odia
            timeout: 75
          - language: Urdu
            timeout: 75
          - language: Punjabi
            timeout: 60
          - language: Bhojpuri
            timeout: 60
          - language: Assamese
            timeout: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON }}
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ensure MIB OTT search seeds
        run: |
          # Standalone script — no import from channel_lists (avoids stale-module ImportError).
          if [ -f scripts/ensure_mib_ott.py ]; then
            python scripts/ensure_mib_ott.py
          else
            python - <<'PY'
          import json, sys
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          out = Path("channel_lists/mib_ott_platforms.json")
          if out.exists():
              try:
                  n = int(json.loads(out.read_text(encoding="utf-8")).get("total") or 0)
                  if n > 0:
                      print(f"MIB OTT platforms (existing): {n}")
                      sys.exit(0)
              except Exception:
                  pass
          url = "https://mib.gov.in/en/node/4054"
          r = requests.get(url, timeout=45, headers={"User-Agent": "Mozilla/5.0"})
          r.raise_for_status()
          table = BeautifulSoup(r.text, "lxml").find("table")
          rows = []
          for tr in (table.find_all("tr") if table else []):
              td = tr.find_all("td")
              if len(td) >= 3 and td[0].get_text(strip=True).isdigit():
                  rows.append({
                      "s_no": int(td[0].get_text(strip=True)),
                      "name": td[1].get_text(" ", strip=True),
                      "entity": td[2].get_text(" ", strip=True),
                  })
          if not rows:
              raise SystemExit("MIB OTT parse failed")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps({
              "source": url, "title": "List of OTT platforms",
              "total": len(rows), "platforms": rows,
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"MIB OTT platforms (fetched): {len(rows)}")
          PY
          fi

      - name: Scrape ${{ matrix.language }} channels (retry once)
        run: |
          FORCE_FRESH="${{ github.event.inputs.force_fresh }}"
          for attempt in 1 2; do
            echo "=== Attempt $attempt ==="
            # Attempt 1 always starts clean so committed stale raw/resume cannot
            # short-circuit the run. Attempt 2 resumes attempt 1 via *_resume.json
            # unless force_fresh was requested.
            FRESH_FLAG="--fresh"
            if [ "$attempt" != "1" ] && [ "$FORCE_FRESH" != "true" ]; then
              FRESH_FLAG=""
            fi
            if python -m scrapers.language "${{ matrix.language }}" --timeout-minutes "${{ matrix.timeout }}" $FRESH_FLAG; then
              echo "SUCCESS on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying..."
            sleep 15
          done
          echo "Both attempts failed"
          exit 1
        env:
          PYTHONUNBUFFERED: '1'

      - name: Show results
        if: always()
        run: python3 scripts/show_results.py "${{ matrix.language }}" || true

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raw-${{ matrix.language }}
          path: output/raw/${{ matrix.language }}.json
          retention-days: 5
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════
  # MERGE: Fan-in — combine all raw JSONs → M3U output
  # ═══════════════════════════════════════════════════════════════
  merge:
    name: Merge & Package
    needs: [scrape-language]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON }}
          cache: pip

      - run: pip install -r requirements.txt

      - name: Clear stale raw outputs
        run: |
          # Checkout may contain output/raw/* from a previous force-commit.
          # Wipe it so only this run's artifacts feed the merge.
          rm -rf output/raw
          mkdir -p output/raw

      - name: Download all raw artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: raw-*
          path: output/raw
          merge-multiple: true

      - name: Show raw inputs
        run: python3 scripts/show_raw_inputs.py

      - name: Merge into M3U
        run: python merge.py

      - name: Validate output
        run: python3 scripts/validate_output.py

      - name: Upload final artifacts
        uses: actions/upload-artifact@v7
        with:
          name: india-iptv-${{ github.run_id }}
          path: |
            output/India.m3u
            output/Language/*.m3u
            output/Source/*.m3u
            output/stats.json
          retention-days: 60
          if-no-files-found: error

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Untrack scraper state AND delete it from disk.
          # origin/main may still track output/raw/*; pull --rebase refuses to
          # checkout those paths while untracked local copies exist.
          git rm -r --cached output/raw --ignore-unmatch >/dev/null 2>&1 || true
          rm -rf output/raw
          find output -name '*_resume.json' -delete 2>/dev/null || true

          git add -f output/India.m3u output/stats.json output/Language output/Source 2>/dev/null || true
          git add -f output/ -- ':!output/raw' 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          CHANNELS=$(grep -c '^#EXTINF' output/India.m3u 2>/dev/null || echo "0")
          git commit -m "scrape: $CHANNELS channels $(date -u +'%Y-%m-%d %H:%M UTC')"

          for i in 1 2 3; do
            # Recover from a half-finished rebase / leftover untracked raw files
            git rebase --abort 2>/dev/null || true
            rm -rf output/raw
            if git pull --rebase --autostash origin main && git push; then
              echo "Push OK on attempt $i"
              exit 0
            fi
            echo "Push failed (attempt $i), retrying..."
            sleep 10
          done
          echo "Push failed after 3 attempts"
          exit 1

      - name: Summary
        if: always()
        run: python3 scripts/summary.py