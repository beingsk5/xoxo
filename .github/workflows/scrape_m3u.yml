name: Scrape Indian IPTV Channels

on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:
    inputs:
      # One checkbox per language (GitHub has no native multi-select choice —
      # actions/runner#2076). All unchecked = run all 14.
      lang_hindi:
        description: 'Hindi'
        type: boolean
        default: false
      lang_tamil:
        description: 'Tamil'
        type: boolean
        default: false
      lang_telugu:
        description: 'Telugu'
        type: boolean
        default: false
      lang_malayalam:
        description: 'Malayalam'
        type: boolean
        default: false
      lang_kannada:
        description: 'Kannada'
        type: boolean
        default: false
      lang_bengali:
        description: 'Bengali'
        type: boolean
        default: false
      lang_marathi:
        description: 'Marathi'
        type: boolean
        default: false
      lang_punjabi:
        description: 'Punjabi'
        type: boolean
        default: false
      lang_gujarati:
        description: 'Gujarati'
        type: boolean
        default: false
      lang_odia:
        description: 'Odia'
        type: boolean
        default: false
      lang_urdu:
        description: 'Urdu'
        type: boolean
        default: false
      lang_bhojpuri:
        description: 'Bhojpuri'
        type: boolean
        default: false
      lang_assamese:
        description: 'Assamese'
        type: boolean
        default: false
      lang_english:
        description: 'English'
        type: boolean
        default: false
      force_fresh:
        description: 'Force fresh data sync'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: scrape-iptv
  cancel-in-progress: true

env:
  PYTHON: '3.12'

jobs:
  # ═══════════════════════════════════════════════════════════════
  # SELECT: Resolve language list (dispatch menu or full schedule set)
  # ═══════════════════════════════════════════════════════════════
  select-languages:
    name: Select Languages
    runs-on: ubuntu-26.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      list: ${{ steps.set.outputs.list }}
    steps:
      - name: Build matrix from checkboxes
        id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          LANG_HINDI: ${{ inputs.lang_hindi }}
          LANG_TAMIL: ${{ inputs.lang_tamil }}
          LANG_TELUGU: ${{ inputs.lang_telugu }}
          LANG_MALAYALAM: ${{ inputs.lang_malayalam }}
          LANG_KANNADA: ${{ inputs.lang_kannada }}
          LANG_BENGALI: ${{ inputs.lang_bengali }}
          LANG_MARATHI: ${{ inputs.lang_marathi }}
          LANG_PUNJABI: ${{ inputs.lang_punjabi }}
          LANG_GUJARATI: ${{ inputs.lang_gujarati }}
          LANG_ODIA: ${{ inputs.lang_odia }}
          LANG_URDU: ${{ inputs.lang_urdu }}
          LANG_BHOJPURI: ${{ inputs.lang_bhojpuri }}
          LANG_ASSAMESE: ${{ inputs.lang_assamese }}
          LANG_ENGLISH: ${{ inputs.lang_english }}
        run: |
          python3 <<'PY'
          import json, os

          # Languages in the canonical matrix order (no per-language time
          # limits — the scraper runs until its queries are exhausted).
          LANGS = [
              "Hindi", "Tamil", "Telugu", "Bengali", "English", "Gujarati",
              "Malayalam", "Kannada", "Marathi", "Odia", "Urdu",
              "Punjabi", "Bhojpuri", "Assamese",
          ]

          checked = [
              lang
              for lang in LANGS
              if os.environ.get("LANG_" + lang.upper(), "").lower() == "true"
          ]

          # Schedule (or no checkbox ticked) → every language
          if os.environ.get("EVENT_NAME") != "workflow_dispatch" or not checked:
              checked = list(LANGS)

          matrix = {"include": [{"language": lang} for lang in checked]}
          list_csv = ",".join(checked)

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              f.write(f"matrix={json.dumps(matrix)}\n")
              f.write(f"list={list_csv}\n")
          print(f"Selected: {list_csv}")
          print(f"Matrix: {json.dumps(matrix)}")
          PY

  # ═══════════════════════════════════════════════════════════════
  # SYNC: Download data files + channel lists (runs once)
  # ═══════════════════════════════════════════════════════════════
  sync-data:
    name: Sync Database
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Download iptv-org CSVs
        run: |
          mkdir -p data
          for file in channels.csv feeds.csv logos.csv languages.csv categories.csv blocklist.csv subdivisions.csv countries.csv; do
            curl -sSfL --retry 3 --retry-delay 5 \
              "https://raw.githubusercontent.com/iptv-org/database/master/data/$file" \
              -o "data/$file" && echo "  $file OK" || echo "  WARN: $file failed"
          done

      - name: Validate
        run: python scripts/validate_data.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          git diff --staged --quiet || {
            git commit -m "sync(iptv-org): $(date -u +'%Y-%m-%d')"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "Push failed (attempt $i), retrying..."
              sleep 10
            done
          }

  sync-channels:
    name: Sync Channel Lists
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON }}
          cache: pip

      - run: pip install requests beautifulsoup4 lxml

      - name: Refresh from BroadcastSeva
        run: python scripts/sync_channel_lists.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channel_lists/ || true
          git diff --staged --quiet || {
            git commit -m "sync(channel-lists): $(date -u +'%Y-%m-%d')"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "Push failed (attempt $i), retrying..."
              sleep 10
            done
          }

  # ═══════════════════════════════════════════════════════════════
  # SCRAPE: Fan-out — one job per *selected* language
  # ═══════════════════════════════════════════════════════════════
  scrape-language:
    name: Scrape ${{ matrix.language }}
    needs: [select-languages, sync-data, sync-channels]
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.select-languages.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON }}
          cache: pip

      - run: pip install -r requirements.txt

      - name: Patchright package version
        id: patchright_ver
        run: |
          echo "v=$(python -c "import importlib.metadata as m; print(m.version('patchright'))")" >> "$GITHUB_OUTPUT"

      - name: Cache Patchright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: patchright-${{ runner.os }}-${{ steps.patchright_ver.outputs.v }}
          restore-keys: |
            patchright-${{ runner.os }}-

      - name: Ensure Patchright browser (download only on version change)
        run: python scripts/ensure_patchright.py

      - name: Ensure MIB OTT search seeds
        run: |
          # Standalone script — no import from channel_lists (avoids stale-module ImportError).
          if [ -f scripts/ensure_mib_ott.py ]; then
            python scripts/ensure_mib_ott.py
          else
            python - <<'PY'
          import json, sys
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          out = Path("channel_lists/mib_ott_platforms.json")
          if out.exists():
              try:
                  n = int(json.loads(out.read_text(encoding="utf-8")).get("total") or 0)
                  if n > 0:
                      print(f"MIB OTT platforms (existing): {n}")
                      sys.exit(0)
              except Exception:
                  pass
          url = "https://mib.gov.in/en/node/4054"
          r = requests.get(url, timeout=45, headers={"User-Agent": "Mozilla/5.0"})
          r.raise_for_status()
          table = BeautifulSoup(r.text, "lxml").find("table")
          rows = []
          for tr in (table.find_all("tr") if table else []):
              td = tr.find_all("td")
              if len(td) >= 3 and td[0].get_text(strip=True).isdigit():
                  rows.append({
                      "s_no": int(td[0].get_text(strip=True)),
                      "name": td[1].get_text(" ", strip=True),
                      "entity": td[2].get_text(" ", strip=True),
                  })
          if not rows:
              raise SystemExit("MIB OTT parse failed")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps({
              "source": url, "title": "List of OTT platforms",
              "total": len(rows), "platforms": rows,
          }, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"MIB OTT platforms (fetched): {len(rows)}")
          PY
          fi

      - name: Download shared dead-URL cache (earlier jobs in this run)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: deadurls-*
          path: .probe_cache
          merge-multiple: true

      - name: Scrape ${{ matrix.language }} channels (retry once)
        run: |
          FORCE_FRESH="${{ github.event.inputs.force_fresh }}"
          for attempt in 1 2; do
            echo "=== Attempt $attempt ==="
            # Attempt 1 always starts clean so committed stale raw/resume cannot
            # short-circuit the run. Attempt 2 resumes attempt 1 via *_resume.json
            # unless force_fresh was requested.
            FRESH_FLAG="--fresh"
            if [ "$attempt" != "1" ] && [ "$FORCE_FRESH" != "true" ]; then
              FRESH_FLAG=""
            fi
            if python -m scrapers.language "${{ matrix.language }}" $FRESH_FLAG; then
              echo "SUCCESS on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying..."
            sleep 15
          done
          echo "Both attempts failed"
          exit 1
        env:
          PYTHONUNBUFFERED: '1'
          PROBE_CACHE_DIR: .probe_cache

      - name: Show results
        if: always()
        run: python3 scripts/show_results.py "${{ matrix.language }}" || true

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raw-${{ matrix.language }}
          path: output/raw/${{ matrix.language }}.json
          retention-days: 5
          if-no-files-found: warn

      - name: Upload dead-URL cache (for later jobs in this run)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deadurls-${{ matrix.language }}
          path: output/raw/${{ matrix.language }}_deadurls.txt
          retention-days: 1
          if-no-files-found: ignore

  # ═══════════════════════════════════════════════════════════════
  # MERGE: Fan-in — only this run's selected-language artifacts
  # ═══════════════════════════════════════════════════════════════
  merge:
    name: Merge & Package
    needs: [select-languages, scrape-language]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON }}
          cache: pip

      - run: pip install -r requirements.txt

      - name: Clear stale raw inputs
        run: |
          # Only raw scraper inputs are cleared (never *.m3u outputs).
          # output/Language/*.m3u and output/Source/*.m3u from previous runs
          # stay on disk untouched — this run only UPDATES the files it writes.
          rm -rf output/raw
          mkdir -p output/raw

      - name: Download raw artifacts (selected languages only)
        uses: actions/download-artifact@v8
        with:
          pattern: raw-*
          path: output/raw
          merge-multiple: true

      - name: Show raw inputs
        run: |
          echo "Selected languages: ${{ needs.select-languages.outputs.list }}"
          python3 scripts/show_raw_inputs.py

      - name: Merge into M3U
        run: python merge.py

      - name: Validate output
        run: python3 scripts/validate_output.py

      - name: Build file list from merge manifest (selected languages only)
        id: manifest
        run: |
          # merge.py records every file it wrote this run. Anything not in the
          # manifest (e.g. Language/<unselected>.m3u from an earlier run) is
          # left untouched and excluded from artifact + commit.
          test -f output/merge_manifest.txt || { echo "merge_manifest.txt missing"; exit 1; }
          {
            echo "files<<EOF"
            tr -d '\r' < output/merge_manifest.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Files produced this run:"
          tr -d '\r' < output/merge_manifest.txt

      - name: Upload final artifacts
        uses: actions/upload-artifact@v7
        with:
          name: india-iptv-${{ github.run_id }}
          path: ${{ steps.manifest.outputs.files }}
          retention-days: 60
          if-no-files-found: error

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Untrack scraper state AND delete it from disk.
          # origin/main may still track output/raw/*; pull --rebase refuses to
          # checkout those paths while untracked local copies exist.
          git rm -r --cached output/raw --ignore-unmatch >/dev/null 2>&1 || true
          rm -rf output/raw
          find output -name '*_resume.json' -delete 2>/dev/null || true

          # Stage ONLY the files merge produced this run (selected languages).
          # Unselected Language/*.m3u files stay tracked and unchanged — no
          # deletion, no update.
          tr -d '\r' < output/merge_manifest.txt | xargs -d '\n' git add -f --

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          CHANNELS=$(grep -c '^#EXTINF' output/India.m3u 2>/dev/null || echo "0")
          git commit -m "scrape: $CHANNELS channels $(date -u +'%Y-%m-%d %H:%M UTC')"

          for i in 1 2 3; do
            # Recover from a half-finished rebase / leftover untracked raw files
            git rebase --abort 2>/dev/null || true
            rm -rf output/raw
            if git pull --rebase --autostash origin main && git push; then
              echo "Push OK on attempt $i"
              exit 0
            fi
            echo "Push failed (attempt $i), retrying..."
            sleep 10
          done
          echo "Push failed after 3 attempts"
          exit 1

      - name: Summary
        if: always()
        run: python3 scripts/summary.py
