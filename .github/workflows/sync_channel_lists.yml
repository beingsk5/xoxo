name: Sync Channel Lists from Wikipedia

on:
  schedule:
    - cron: '0 4 * * *'  # Run daily at 4 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 lxml PyMuPDF

      - name: Fetch channel lists from Wikipedia
        run: python scripts/sync_channel_lists.py

      - name: Verify output files
        run: python scripts/verify_channel_lists.py

      - name: Commit updated channel lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channel_lists/ || true
          git diff --staged --quiet || {
            git commit -m "Sync Wikipedia channel lists $(date -u +'%Y-%m-%d')"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "Push failed (attempt $i), retrying..."
              sleep 10
            done
          }