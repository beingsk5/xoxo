name: Sync iptv-org Database

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download latest data from iptv-org/database
        run: |
          mkdir -p data
          for file in channels.csv feeds.csv logos.csv languages.csv categories.csv blocklist.csv subdivisions.csv countries.csv; do
            curl -sL "https://raw.githubusercontent.com/iptv-org/database/master/data/$file" -o "data/$file"
            echo "Downloaded $file ($(wc -c < data/$file) bytes)"
          done

      - name: Verify data integrity
        run: python scripts/validate_data.py --full

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          git diff --staged --quiet || {
            git commit -m "Sync iptv-org database $(date -u +'%Y-%m-%d')"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "Push failed (attempt $i), retrying..."
              sleep 10
            done
          }
