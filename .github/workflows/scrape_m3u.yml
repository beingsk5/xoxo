name: Scrape Indian IPTV Channels

on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync iptv-org database
        run: |
          for file in channels.csv feeds.csv logos.csv languages.csv categories.csv blocklist.csv; do
            curl -sL "https://raw.githubusercontent.com/iptv-org/database/master/data/$file" -o "data/$file"
            echo "Synced $file"
          done

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scraper.py

      - name: List results
        run: |
          find output/ -type f -name "*.m3u" | head -30
          echo "---"
          find output/ -type d | head -20

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: india-iptv-${{ github.run_id }}
          path: |
            output/*/India.m3u
            output/*/Language/*.m3u
            output/*/Source/*.m3u
          retention-days: 60

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ || true
          git diff --staged --quiet || git commit -m "Update Indian IPTV channels $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push || true
