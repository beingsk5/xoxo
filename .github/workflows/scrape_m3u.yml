name: Scrape Indian IPTV Channels

on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create output dir
        run: mkdir -p output

      - name: Run scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scraper.py

      - name: List results
        run: ls -lh output/

      - name: Upload M3U playlist
        uses: actions/upload-artifact@v4
        with:
          name: india-m3u-${{ github.run_id }}
          path: output/india_*.m3u
          retention-days: 60

      - name: Upload TXT
        uses: actions/upload-artifact@v4
        with:
          name: india-txt-${{ github.run_id }}
          path: output/india_*.txt
          retention-days: 60

      - name: Upload JSON
        uses: actions/upload-artifact@v4
        with:
          name: india-json-${{ github.run_id }}
          path: output/india_*.json
          retention-days: 60

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/ || true
          git diff --staged --quiet || git commit -m "Update Indian IPTV channels $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push || true
