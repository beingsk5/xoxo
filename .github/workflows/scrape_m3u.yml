name: Scrape Indian IPTV Channels

on:
  schedule:
    - cron: '0 6 * * 1,4'
  workflow_dispatch:
    inputs:
      force_fresh:
        description: 'Force fresh data sync'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: scrape-iptv
  cancel-in-progress: true

env:
  PYTHON: '3.12'

jobs:
  # ═══════════════════════════════════════════════════════════════
  # SYNC: Download data files + channel lists (runs once)
  # ═══════════════════════════════════════════════════════════════
  sync-data:
    name: Sync Database
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Download iptv-org CSVs
        run: |
          mkdir -p data
          for file in channels.csv feeds.csv logos.csv languages.csv categories.csv blocklist.csv subdivisions.csv countries.csv; do
            curl -sSfL --retry 3 --retry-delay 5 \
              "https://raw.githubusercontent.com/iptv-org/database/master/data/$file" \
              -o "data/$file" && echo "  $file OK" || echo "  WARN: $file failed"
          done

      - name: Validate
        run: python scripts/validate_data.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ || true
          git diff --staged --quiet || {
            git commit -m "sync(iptv-org): $(date -u +'%Y-%m-%d')"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "Push failed (attempt $i), retrying..."
              sleep 10
            done
          }

  sync-channels:
    name: Sync Channel Lists
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON }}
          cache: pip

      - run: pip install requests beautifulsoup4 lxml pymupdf

      - name: Refresh from Wikipedia + Airtel PDF
        run: python scripts/sync_channel_lists.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add channel_lists/ || true
          git diff --staged --quiet || {
            git commit -m "sync(channel-lists): $(date -u +'%Y-%m-%d')"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "Push failed (attempt $i), retrying..."
              sleep 10
            done
          }

  # ═══════════════════════════════════════════════════════════════
  # SCRAPE: Fan-out — one job per language (parallel)
  # ═══════════════════════════════════════════════════════════════
  scrape-language:
    name: Scrape ${{ matrix.language }}
    needs: [sync-data, sync-channels]
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        language:
          - Hindi
          - Tamil
          - Telugu
          - Malayalam
          - Kannada
          - Bengali
          - Marathi
          - Punjabi
          - Gujarati
          - Odia
          - Urdu
          - Bhojpuri
          - Assamese
          - English
        timeout:
          - 95
        include:
          - language: Malayalam
            timeout: 75
          - language: Kannada
            timeout: 75
          - language: Marathi
            timeout: 75
          - language: Odia
            timeout: 75
          - language: Urdu
            timeout: 75
          - language: Punjabi
            timeout: 60
          - language: Bhojpuri
            timeout: 60
          - language: Assamese
            timeout: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON }}
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape ${{ matrix.language }} channels (retry once)
        run: |
          for attempt in 1 2; do
            echo "=== Attempt $attempt ==="
            if python -m scrapers.language "${{ matrix.language }}" --timeout-minutes "${{ matrix.timeout }}"; then
              echo "SUCCESS on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying..."
            sleep 15
          done
          echo "Both attempts failed"
          exit 1
        env:
          PYTHONUNBUFFERED: '1'

      - name: Show results
        if: always()
        run: python3 scripts/show_results.py "${{ matrix.language }}" || true

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raw-${{ matrix.language }}
          path: output/raw/${{ matrix.language }}.json
          retention-days: 5
          if-no-files-found: warn

  # ═══════════════════════════════════════════════════════════════
  # MERGE: Fan-in — combine all raw JSONs → M3U output
  # ═══════════════════════════════════════════════════════════════
  merge:
    name: Merge & Package
    needs: [scrape-language]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON }}
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download all raw artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: raw-*
          path: output/raw
          merge-multiple: true

      - name: Show raw inputs
        run: python3 scripts/show_raw_inputs.py

      - name: Merge into M3U
        run: python merge.py

      - name: Validate output
        run: python3 scripts/validate_output.py

      - name: Upload final artifacts
        uses: actions/upload-artifact@v7
        with:
          name: india-iptv-${{ github.run_id }}
          path: |
            output/India.m3u
            output/Language/*.m3u
            output/Source/*.m3u
            output/stats.json
          retention-days: 60
          if-no-files-found: error

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/ || true
          if ! git diff --staged --quiet; then
            CHANNELS=$(grep -c '^#EXTINF' output/India.m3u 2>/dev/null || echo "0")
            git commit -m "scrape: $CHANNELS channels $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "Push failed (attempt $i), retrying..."
              sleep 10
            done
          fi

      - name: Summary
        if: always()
        run: python3 scripts/summary.py